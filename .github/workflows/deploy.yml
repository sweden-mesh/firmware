# Publishes the site: the page, index.json, and the ESP32 images of the latest full release,
# so the page can read them (GitHub's release downloads cannot be read by another site's
# page). The images go into the Pages artifact only, never into git. One release is hosted at
# a time: Pages sites may be 1 GB.
name: Deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # from index.yml, when it committed a new index.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # index.yml's commit is newer than the run that called us

      - name: Which release is hosted
        id: release
        run: |
          tag=$(python3 -c 'import json; print(next(r["tag"] for r in json.load(open("index.json"))["releases"] if r.get("hosted")))')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "hosting $tag"

      - name: Cached images of that release
        id: cache
        uses: actions/cache@v4
        with:
          path: fw-cache
          key: fw-esp32-nrf52-${{ steps.release.outputs.tag }}   # the set of files is part of the key

      - name: Download the ESP32 images and nRF52 DFU packages
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fw-cache
          gh release download "${{ steps.release.outputs.tag }}" -R "$(python3 -c 'import json; print(json.load(open("index.json"))["repo"])')" \
            -D fw-cache -p '*-esp32*-v*.bin' -p '*-nrf52840-v*.zip'

      - name: Build the site and check every image
        run: |
          mkdir -p _site
          cp index.html index.json strings.js releases.js flasher.js .nojekyll _site/
          [ -d vendor ] && cp -r vendor _site/
          python3 tools/host_images.py index.json "${{ steps.release.outputs.tag }}" fw-cache _site
          du -sh _site

      # The regional sites' flashers read fw/ from Cloudflare R2 (fw.meshcoresverige.se). Skipped
      # until the bucket's secrets exist. Images are immutable (the name carries version and
      # hash); hosted.json changes with each release, so it is short-lived.
      - name: Upload fw/ to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        if: env.R2_ACCOUNT_ID != ''
        run: |
          ep="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync _site/fw/ s3://meshcore-fw/fw/ --endpoint-url "$ep" --exclude hosted.json \
            --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          aws s3 cp _site/fw/hosted.json s3://meshcore-fw/fw/hosted.json --endpoint-url "$ep" \
            --cache-control 'public, max-age=300' --content-type application/json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The artifact is some hundred MB, and the deploy step sometimes asks for it before GitHub
      # lists it ("No artifacts named github-pages", three times on 2026-11-25): try once, wait, try again.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
