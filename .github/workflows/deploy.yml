# Publishes the site: the page, index.json, and the ESP32 images of the latest full release,
# so the page can read them (GitHub's release downloads cannot be read by another site's
# page). The images go into the Pages artifact only, never into git. One release is hosted at
# a time: Pages sites may be 1 GB.
name: Deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # from index.yml, when it committed a new index.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # index.yml's commit is newer than the run that called us

      - name: Which release is hosted
        id: release
        run: |
          tag=$(python3 -c 'import json; print(next(r["tag"] for r in json.load(open("index.json"))["releases"] if not r["prerelease"]))')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "hosting $tag"

      - name: Cached images of that release
        id: cache
        uses: actions/cache@v4
        with:
          path: fw-cache
          key: fw-${{ steps.release.outputs.tag }}

      - name: Download the ESP32 images
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fw-cache
          gh release download "${{ steps.release.outputs.tag }}" -R "$(python3 -c 'import json; print(json.load(open("index.json"))["repo"])')" \
            -D fw-cache -p '*-esp32*-v*.bin'

      - name: Build the site and check every image
        run: |
          mkdir -p _site
          cp index.html index.json .nojekyll _site/
          [ -d vendor ] && cp -r vendor _site/
          python3 tools/host_images.py index.json "${{ steps.release.outputs.tag }}" fw-cache _site
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
