<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lou-firmware för MeshCore</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="description" content="MeshCore-firmware från sweden-mesh med autosvar och fjärrstyrning. Välj funktioner och kort och få en fil.">
<link rel="alternate" hreflang="sv" href="https://sweden-mesh.github.io/firmware/?lang=sv">
<link rel="alternate" hreflang="en" href="https://sweden-mesh.github.io/firmware/?lang=en">
<link rel="alternate" hreflang="x-default" href="https://sweden-mesh.github.io/firmware/">
<style>
:root{
  --bg:#f6f8f7;--surface:#fff;--fg:#14201c;--muted:#5b6b66;--line:#dfe6e3;
  --accent:#0f766e;--accent-fg:#fff;--accent-soft:#e3f3f1;--accent-line:#9fd8d1;
  --warn:#8a5a00;--warn-soft:#fff6e0;--off:#9aa7a2;--shadow:0 1px 2px rgb(16 32 28/.06),0 4px 16px rgb(16 32 28/.06);
  --hero:linear-gradient(135deg,#0f766e 0%,#115e59 55%,#134e4a 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1311;--surface:#131c19;--fg:#e4ecea;--muted:#93a6a0;--line:#24322e;
  --accent:#2dd4bf;--accent-fg:#06221e;--accent-soft:#0f2a26;--accent-line:#1f5d55;
  --warn:#f5c060;--warn-soft:#2a2210;--off:#5c6b67;--shadow:0 1px 2px rgb(0 0 0/.3),0 4px 16px rgb(0 0 0/.25);
  --hero:linear-gradient(135deg,#0d3d38 0%,#0b2f2b 60%,#0a2522 100%);
}}
:root[data-theme="dark"]{
  --bg:#0c1311;--surface:#131c19;--fg:#e4ecea;--muted:#93a6a0;--line:#24322e;
  --accent:#2dd4bf;--accent-fg:#06221e;--accent-soft:#0f2a26;--accent-line:#1f5d55;
  --warn:#f5c060;--warn-soft:#2a2210;--off:#5c6b67;--shadow:0 1px 2px rgb(0 0 0/.3),0 4px 16px rgb(0 0 0/.25);
  --hero:linear-gradient(135deg,#0d3d38 0%,#0b2f2b 60%,#0a2522 100%);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code{font:.86em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}

/* hero */
header.hero{background:var(--hero);color:#fff;padding:44px 0 56px}
.hero .top{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin:0 0 10px}
.langs{display:flex;gap:4px;font-size:.88rem}
.langs a{color:#fff;opacity:.78;text-decoration:none;padding:6px 8px;border-radius:6px}
.langs a:hover{opacity:1;background:rgb(255 255 255/.08)}
.langs a[aria-current]{opacity:1;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
.hero p{max-width:680px;margin:0 0 12px;opacity:.92}
.hero p a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.hero code{background:rgb(255 255 255/.14);color:#fff}
.hero .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none;font-size:.95rem}
.btn-light{background:#fff;color:#0f3d39}
.btn-ghost{color:#fff;border:1px solid rgb(255 255 255/.4)}
.btn-ghost:hover{background:rgb(255 255 255/.08)}

main{margin-top:-28px}
section{margin-bottom:40px}
h2{font-size:1.35rem;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}

/* feature cards */
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.feature{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.feature header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feature h3{margin:0;font-size:1.15rem}
.tag{font:600 .75rem ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:2px 8px}
.tag.ext{color:var(--muted);background:transparent;border-color:var(--line);font-family:inherit}
.feature dl{margin:0;display:grid;gap:10px}
.feature dt{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.feature dd{margin:2px 0 0;font-size:.95rem}
.feature .more{margin-top:auto;padding-top:14px;font-weight:600;text-decoration:none}
.feature .more:hover{text-decoration:underline}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:14px}
.mini .feature{box-shadow:none;padding:16px}
.mini .feature p{margin:0;font-size:.93rem;color:var(--muted)}

/* picker */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px 22px 22px}
fieldset{border:0;padding:0;margin:22px 0 0}
legend{font-weight:700;font-size:1.02rem;padding:0;margin-bottom:10px;display:flex;gap:10px;align-items:center}
legend .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.82rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent-line)}
.opt input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:disabled){cursor:not-allowed;color:var(--off);border-style:dashed}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt b{display:block;font-size:.98rem}
.opt small{color:var(--muted);display:block;line-height:1.4;font-size:.86rem;margin-top:2px}
.opt:has(input:disabled) small{color:var(--off)}
input[type=search],select{width:100%;padding:10px 12px;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
input[type=search]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
#boards{margin-top:8px}
.hint{font-size:.88rem;color:var(--muted);margin:8px 0 0}

/* result */
.result{margin-top:24px;border:1.5px solid var(--accent);border-radius:14px;padding:18px 20px;background:var(--accent-soft)}
.result.neutral{border-color:var(--line);background:transparent}
.result h3{margin:0 0 4px;font-size:1.15rem}
.result .meta{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.btn-main{background:var(--accent);color:var(--accent-fg)}
.btn-main:hover{filter:brightness(1.07)}
.file{word-break:break-all;font-size:.82rem;color:var(--muted);margin:10px 0 0}
ol.how{margin:14px 0 0;padding-left:20px}
ol.how li{margin:4px 0}
.flash{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.flash .hint{flex-basis:100%;margin:2px 0 0}
.btn-quiet{border:1.5px solid var(--accent-line);color:var(--accent);background:transparent}
button.btn{border:1.5px solid transparent;cursor:pointer;font-family:inherit}
button.btn:disabled{opacity:.55;cursor:default}
#flash-run{flex-basis:100%}
#flash-run progress{width:100%;height:10px;accent-color:var(--accent)}
.flash-step{margin:6px 0 0;font-size:.92rem}
.flash-step.ok{color:var(--accent);font-weight:600}
.flash-step.bad{color:#c2410c;font-weight:600}
.flash-log summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
.flash-log pre{max-height:180px;overflow:auto;font-size:.78rem;margin:6px 0 0;white-space:pre-wrap}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:12px 0 0}
#cfg label.field{display:block;font-weight:600;font-size:.95rem;margin:4px 0 12px}
#cfg label.field select,#cfg label.field input{margin-top:6px;font-weight:400}
#cfg input[type=text]{width:100%;padding:10px 12px;font:.9rem ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
#cfg input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
#cfg input.bad{border-color:#c2410c}
pre.cmds{margin:6px 0 0;padding:14px 16px;border-radius:12px;background:#0f1a17;color:#d7f3ee;font:.88rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre}
.cmd-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.copy{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:6px 12px;font:600 .85rem system-ui,sans-serif;cursor:pointer}
.copy:hover{border-color:var(--accent)}
.key-row{display:flex;gap:8px;margin-top:6px}
.key-row input{margin-top:0!important}
.key-row .copy{white-space:nowrap}
dialog.keydlg{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgb(0 0 0/.35)}
dialog.keydlg::backdrop{background:rgb(8 16 14/.55)}
.keydlg .body{padding:22px 22px 18px}
.keydlg h3{margin:0 0 8px;font-size:1.2rem}
.keydlg .secret{font:.9rem/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:#0f1a17;color:#d7f3ee;border-radius:10px;padding:12px 14px;margin:12px 0}
.keydlg ul{margin:8px 0 0;padding-left:20px;font-size:.93rem}
.keydlg li{margin:4px 0}
.keydlg .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
details.ver{margin-top:18px;font-size:.9rem}
details.ver summary{cursor:pointer;color:var(--muted)}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:56px 0 40px}
.alt h2{font-size:1.15rem;margin:0 0 6px}
.alt p{margin:0 0 6px}
.alt ul{margin:0 0 12px;padding-left:20px}
.alt li{margin:4px 0}
.alt .others{margin-top:4px}
.alt .others li{font-size:.93rem}
.alt .ours{margin:0;color:var(--muted);font-size:.93rem}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:.88rem;color:var(--muted)}
@media (max-width:520px){.panel{padding:4px 14px 16px}.feature{padding:16px}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="top">
      <nav class="langs" id="langs" data-i18n-label="lang.label">
        <a href="?lang=sv" hreflang="sv" lang="sv" data-lang="sv">Svenska</a>
        <a href="?lang=en" hreflang="en" lang="en" data-lang="en">English</a>
      </nav>
    </div>
    <h1 data-i18n="hero.h1"></h1>
    <p class="std" data-i18n="hero.std"></p>
    <p data-i18n="hero.p1"></p>
    <p data-i18n="hero.p2"></p>
    <div class="links">
      <a class="btn btn-light" href="#valj" data-i18n="hero.find"></a>
      <a class="btn btn-ghost" href="https://github.com/sweden-mesh/MeshCore-lou#readme" data-i18n="hero.readme"></a>
    </div>
  </div>
</header>

<main class="wrap">
<aside class="alt" aria-labelledby="h-alt">
  <h2 id="h-alt" data-i18n="alt.h"></h2>
  <p data-i18n="alt.p"></p>
  <ul>
    <li data-i18n="alt.official"></li>
    <li data-i18n="alt.observer"></li>
  </ul>
  <p class="others" data-i18n="alt.others"></p>
  <ul class="others">
    <li data-i18n="alt.cairn"></li>
    <li data-i18n="alt.easyskymesh"></li>
    <li data-i18n="alt.meck"></li>

  </ul>
  <p class="ours" data-i18n="alt.ours"></p>
</aside>

<section aria-labelledby="h-funktioner">
  <h2 id="h-funktioner" data-i18n="feat.h"></h2>
  <p class="sub" data-i18n="feat.sub"></p>
  <div class="features">
    <article class="feature">
      <header><h3 data-i18n="feat.ar.h"></h3><span class="tag">ar</span></header>
      <dl>
        <dt data-i18n="feat.problem"></dt>
        <dd data-i18n="feat.ar.problem"></dd>
        <dt data-i18n="feat.solution"></dt>
        <dd data-i18n="feat.ar.solution"></dd>
        <dt data-i18n="feat.mind"></dt>
        <dd data-i18n="feat.ar.mind"></dd>
      </dl>
      <a class="more" href="https://github.com/sweden-mesh/MeshCore-lou/blob/fork/observer/docs/autoreply.md" data-i18n="feat.ar.more"></a>
    </article>
    <article class="feature">
      <header><h3 data-i18n="feat.rc.h"></h3><span class="tag">rc</span></header>
      <dl>
        <dt data-i18n="feat.problem"></dt>
        <dd data-i18n="feat.rc.problem"></dd>
        <dt data-i18n="feat.solution"></dt>
        <dd data-i18n="feat.rc.solution"></dd>
        <dt data-i18n="feat.mind"></dt>

<section id="valj" aria-labelledby="h-valj">
  <h2 id="h-valj" data-i18n="pick.h"></h2>

  <div class="panel">
    <fieldset id="s-type">
      <legend><span class="n">1</span><span data-i18n="pick.type"></span></legend>
      <div class="opts">
        <label class="opt"><input type="radio" name="type" value="repeater" checked><span><b>Repeater</b><small data-i18n="opt.repeater"></small></span></label>
        <label class="opt"><input type="radio" name="type" value="companion" disabled><span><b>Companion</b><small data-i18n="opt.companion"></small></span></label>
      </div>
    </fieldset>

    <fieldset id="s-features">
      <legend><span class="n">2</span><span data-i18n="pick.features"></span></legend>
      <div class="opts">
        <label class="opt"><input type="checkbox" name="f" value="obs"><span><b>Observer</b><small data-i18n="opt.obs"></small></span></label>
        <label class="opt"><input type="checkbox" name="f" value="ar" checked><span><b data-i18n="opt.ar.b"></b><small data-i18n="opt.ar"></small></span></label>
        <label class="opt"><input type="checkbox" name="f" value="rc"><span><b data-i18n="opt.rc.b"></b><small data-i18n="opt.rc"></small></span></label>

    <fieldset id="s-hw">
      <legend><span class="n">4</span><span data-i18n="pick.hw"></span></legend>

    <fieldset id="cfg" hidden>

  </div>
</section>
</main>

<footer>
  <div class="wrap"><span data-i18n="footer"></span> <span id="gen"></span></div>
</footer>

<script>
const INDEX = 'index.json';
const STOCK_FLASHER = 'https://meshcore.io/flasher';
const OBSERVER_HOME = 'https://observer.gessaman.com/';

const REGION_LIST = 'https://raw.githubusercontent.com/zombiefredrik/meshcore-se-regioner/main/data/regioner.csv';
// The SCB codes of the counties; their names are county.<code> in strings.js.
const COUNTIES = ['01', '03', '04', '05', '06', '07', '08', '09', '10', '12', '13', '14',
                  '17', '18', '19', '20', '21', '22', '23', '24', '25'];
// A county's region, from zombiefredrik/meshcore-se-regioner: the name it decided itself
// (beslut lokalt), else the name measured in use on the air (uppmatt), else the list's
// proposal (forslag). Its SCB code only when the list cannot be read or has no valid name.
const chosenNames = new Map(), nameStatus = new Map();
const countyScope = code => chosenNames.get(code) || 'se' + code;

const $ = id => document.getElementById(id);
const checked = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
let index = null, release = null;
let flashing = false;   // while a board is written, the result box stays as it is

// The language: ?lang= in the address, else the visitor's last choice, else the browser's.
// All text is in strings.js, one table per language.
const LANGS = ['sv', 'en'];
function savedLang(){ try { return localStorage.getItem('lang'); } catch { return null; } }
function saveLang(l){ try { localStorage.setItem('lang', l); } catch {} }
let lang = [new URLSearchParams(location.search).get('lang'), savedLang(),
            /^sv\b/i.test(navigator.language || '') ? 'sv' : 'en'].find(l => LANGS.includes(l));
const t = (key, vars) => translate(lang, key, vars);

function applyStrings(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelector('meta[name="description"]').content = t('meta.description');
  for (const e of document.querySelectorAll('[data-i18n]')) e.innerHTML = t(e.dataset.i18n);
  for (const e of document.querySelectorAll('[data-i18n-ph]')) e.placeholder = t(e.dataset.i18nPh);
  for (const e of document.querySelectorAll('[data-i18n-label]')) e.setAttribute('aria-label', t(e.dataset.i18nLabel));
  for (const a of document.querySelectorAll('#langs a')){
    if (a.dataset.lang === lang) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  }
  fillCounties();
  if (index) fillReleases();
}

// The switch keeps the choice, and puts it in the address so that a shared link keeps it too.
function setLang(l){
  lang = l;
  saveLang(l);
  const u = new URL(location.href);
  u.searchParams.set('lang', l);
  history.replaceState(null, '', u);
  applyStrings();
  if (index) update();
}

function pretty(hw){ const s = hw.replace(/_/g, ' '); return s[0].toUpperCase() + s.slice(1); }
function mb(n){ return (n / 1048576).toLocaleString(lang === 'sv' ? 'sv-SE' : 'en-GB', {maximumFractionDigits: 1}) + ' MB'; }

// The features ticked, as the image's base and feature code; an empty code when no image of ours fits.
function wanted(){
  const f = new Set(checked('f'));
  const base = f.has('obs') ? 'observer' : 'core';
  const code = (f.has('ar') ? 'ar' : '') + (f.has('rc') ? 'rc' : '');
  return {base, code, f};
}

function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('f')){
    const f = h.get('f').split(',');
    for (const i of document.querySelectorAll('input[name="f"]')) i.checked = !i.disabled && f.includes(i.value);
  }
  if (h.get('install') === 'new') document.querySelector('input[name="install"][value="new"]').checked = true;
  if (COUNTIES.includes(h.get('lan'))) $('lan').value = h.get('lan');
  return {hw: h.get('hw'), r: h.get('r')};
}
function writeHash(){
  const h = new URLSearchParams();
  h.set('f', checked('f').join(','));
  h.set('install', checked('install')[0]);
  if ($('boards').value) h.set('hw', $('boards').value);
  if ($('lan').value) h.set('lan', $('lan').value);
  if (release && release !== offered(index.releases)[0]) h.set('r', release.tag);
  history.replaceState(null, '', '#' + h);
}

// The release shown: the one asked for when it is offered, else the newest. None when there is none.
function pickRelease(tag){
  const list = offered(index.releases);
  release = list.find(r => r.tag === tag) || list[0] || null;
  if (release) $('release').value = release.tag;
}

function fillBoards(keep){
  const {base, code} = wanted();
  const q = $('filter').value.toLowerCase().replace(/[\s_-]+/g, ' ').trim();
  const sel = $('boards'), want = keep || sel.value;
  const hws = [...new Set((release ? release.images : []).filter(i => i.base === base && i.features === code).map(i => i.hw))]
    .sort((a, b) => a.localeCompare(b, 'sv', {sensitivity: 'base'}));
  sel.innerHTML = '';
  let group = null, shown = 0;
  for (const hw of hws){
    if (q && !pretty(hw).toLowerCase().includes(q)) continue;
    const maker = hw.split('_')[0].toLowerCase();
    if (!group || group.dataset.maker !== maker){
      group = document.createElement('optgroup');
      group.label = pretty(hw.split('_')[0]);
      group.dataset.maker = maker;
      sel.add(group);
    }
    const o = new Option(pretty(hw), hw);
    if (hw === want) o.selected = true;
    group.append(o);
    shown++;
  }
  $('hw-hint').textContent = !hws.length ? '' :
    want && !hws.includes(want) ? t('hw.missing', {board: pretty(want)}) :
    t(q ? 'hw.count.match' : 'hw.count', {n: hws.length, m: shown});
}

function onward(text, href, label){
  return `<div class="result neutral"><h3>${t('res.onward')}</h3><p class="meta">${text}</p><a class="btn btn-main" href="${href}">${label}</a></div>`;
}

function render(){
  renderResult();
  renderConfig();
}

function renderResult(){
  if (flashing) return;
  writeHash();
  const out = $('out'), {base, code, f} = wanted();
  if (!release){ out.innerHTML = `<div class="result neutral"><p class="meta" style="margin:0">${t('load.none')}</p></div>`; return; }
  if (!code){
    out.innerHTML = f.has('obs')
      ? onward(t('res.onward.obs'), OBSERVER_HOME, t('res.onward.obs.link'))
      : onward(t('res.onward.stock'), STOCK_FLASHER, t('res.onward.stock.link'));
    return;
  }
  const hw = $('boards').value;
  if (!hw){ out.innerHTML = `<div class="result neutral"><p class="meta" style="margin:0">${t('res.pickhw')}</p></div>`; return; }
  const set = release.images.filter(i => i.hw === hw && i.base === base && i.features === code);
  if (!set.length){ out.innerHTML = `<div class="result neutral"><p class="meta" style="margin:0">${t('res.nofile')}</p></div>`; return; }
  const fresh = checked('install')[0] === 'new';
  const mcu = set[0].mcu, esp = mcu.startsWith('esp32'), stm = mcu.startsWith('stm32'), rp = mcu === 'rp2040';
  const img = esp ? set.find(i => i.form === (fresh ? 'merged' : 'bin'))
            : stm ? (set.find(i => i.form === 'hex') || set[0])
            : (set.find(i => i.form === 'uf2') || set[0]);
  const dfu = !esp && set.find(i => i.form === 'zip');
  let how;
  if (stm){
    how = `<ol class="how"><li>${t('how.stm.1')}</li>
      <li>${t(fresh ? 'how.stm.2.new' : 'how.stm.2')}</li></ol>`;
  } else if (rp){
    how = `<ol class="how"><li>${t('how.rp.1')}</li><li>${t('how.uf2.copy')}</li></ol>
      ${fresh ? `<p class="note">${t('how.rp.new')}</p>` : ''}`;
  } else if (esp && fresh){
    how = `<ol class="how"><li>${t('how.espnew.1', {flasher: STOCK_FLASHER})}</li>
      <li>${t('how.espnew.2')}</li></ol>`;
  } else if (esp){
    how = `<ol class="how"><li>${t('how.esp.1', {flasher: STOCK_FLASHER})}</li>
      ${base === 'observer' ? `<li>${t('how.esp.ota')}</li>` : ''}</ol>
      <p class="note">${t('how.esp.note', {mcu})}</p>`;
  } else {
    how = `<ol class="how"><li>${t('how.uf2.1')}</li><li>${t('how.uf2.copy')}</li></ol>
      ${dfu ? `<p class="hint">${t('how.uf2.dfu', {url: dfu.url, size: mb(dfu.size)})}</p>` : ''}
      ${fresh ? `<p class="note">${t('how.uf2.new')}</p>` : ''}`;
  }
  out.innerHTML = `<div class="result">
    <h3>${pretty(hw)} — ${t('res.' + code)}${base === 'observer' ? ', Observer' : ''}</h3>
    <p class="meta">${release.tag} · ${t(fresh ? 'res.new' : 'res.update')} · <a href="${release.url}">${t('res.notes')}</a></p>
    ${canFlash(img) ? `<div class="flash"><button type="button" class="btn btn-main" id="flash-btn">${t('res.flash')}</button>
      <a class="btn btn-quiet" href="${img.url}" download>${t('res.download', {size: mb(img.size)})}</a>
      <p class="hint">${t('res.flash.hint')} ${t(fresh ? 'res.flash.hint.new' : 'res.flash.hint.update')}</p>
      <div id="flash-run" hidden><progress id="flash-bar" max="1" value="0"></progress><p id="flash-step" class="flash-step"></p>
      <details class="flash-log"><summary>${t('res.log')}</summary><pre id="flash-log"></pre></details></div></div>`
    : `<a class="btn btn-main" href="${img.url}" download>${t('res.download', {size: mb(img.size)})}</a>`}
    <p class="file">${img.file}${img.sha256 ? `<br>sha256 ${img.sha256}` : ''}</p>
    ${how}</div>`;
  if (canFlash(img)) $('flash-btn').onclick = () => startFlash(img, fresh);
}

// The page flashes ESP32 images of the release hosted next to it, in browsers with Web Serial.
// Until it has been tested on real boards it shows only with ?flasha in the address.
const FLASH_TRIAL = new URLSearchParams(location.search).has('flasha');
function canFlash(img){
  return FLASH_TRIAL && img.mcu.startsWith('esp32') && release.hosted && 'serial' in navigator;
}

async function startFlash(img, fresh){
  let port;
  try { port = await navigator.serial.requestPort(); } catch { return; }   // the user closed the picker
  const btn = $('flash-btn'), step = $('flash-step'), bar = $('flash-bar'), log = $('flash-log');
  flashing = true;
  const locked = [...document.querySelectorAll('#valj input, #valj select')].filter(e => !e.disabled);
  btn.disabled = true;
  locked.forEach(e => e.disabled = true);
  $('flash-run').hidden = false;
  step.className = 'flash-step';
  log.textContent = '';
  try {
    const {flash} = await import('./flasher.js');
    await flash({port, img, url: release.hosted + img.file, fresh,
      onStep: t => step.textContent = t,
      onProgress: f => bar.value = f,
      onLog: l => log.textContent += l + '\n', t});
    step.textContent = t('res.flash.done');
    step.classList.add('ok');
  } catch (e){
    step.textContent = e.message || String(e);
    step.classList.add('bad');
  } finally {
    flashing = false;
    btn.disabled = false;
    locked.forEach(e => e.disabled = false);
  }
}

// Step 5: the console commands for the features chosen, after flashing.
function renderConfig(){
  const {code} = wanted();
  const ready = release && code && $('boards').value && !$('out').querySelector('.neutral');
  $('cfg').hidden = $('done').hidden = !ready;
  if (!ready) return;
  const ar = code.includes('ar'), rc = code.includes('rc');
  $('cfg-ar').hidden = !ar;
  $('cfg-rc').hidden = !rc;
  const lines = [];
  if (ar){
    const lan = $('lan').value;
    const scope = lan ? countyScope(lan) : t('cfg.county.placeholder');
    $('lan-hint').innerHTML = lan
      ? t('cfg.county.set', {scope, status: nameStatus.has(lan) ? t('cfg.status.' + nameStatus.get(lan)) : ''})
      : t('cfg.county.hint');
    lines.push(`region put ${scope}`, 'region put se', `region home ${scope}`, 'region default se', 'region save', 'set autoreply on');
  }
  if (rc){
    const key = $('pubkey').value.trim();
    const ok = /^[0-9a-fA-F]{64}$/.test(key);
    $('pubkey').classList.toggle('bad', key !== '' && !ok);
    // From lou-20 the settings are named cmd.*; lou-19 and older know only mqtt.cmd.*.
    const rev = Number((/-lou-(\d+)/.exec(release ? release.tag : '') || [])[1] || 0);
    const p = rev >= 20 ? 'cmd' : 'mqtt.cmd';
    lines.push(`set ${p}.pubkey ${ok ? key.toUpperCase() : t('cfg.key.placeholder')}`, `set ${p} on`, 'reboot');
  }
  $('cmds').textContent = lines.join('\n');
  const esc = s => s.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const channel = '#test-' + (ar && $('lan').value ? countyScope($('lan').value) : esc(t('cfg.county.placeholder')));
  $('done-text').innerHTML = t('done.congrats') + (ar ? t('done.ar', {channel}) : t('done.rc'));
}

function update(keepBoard){ fillBoards(keepBoard); render(); }

async function load(){
  try {
    const r = await fetch(INDEX, {cache: 'no-cache'});
    if (!r.ok) throw new Error(t('load.status', {status: r.status}));
    index = await r.json();
  } catch (e){
    $('out').innerHTML = `<p class="hint">${t('load.fail', {error: e.message})}</p>`;
    return;
  }
  if (!index.releases.length){ $('out').innerHTML = `<p class="hint">${t('load.none')}</p>`; return; }
  $('all').href = `https://github.com/${index.repo}/releases`;
  fillReleases();
  const s = readHash();
  pickRelease(s.r);
  update(s.hw);
  loadCountyNames();
}

async function loadCountyNames(){
  try {
    const r = await fetch(REGION_LIST);
    if (!r.ok) return;
    const [head, ...rows] = (await r.text()).split(/\r?\n/);
    const col = Object.fromEntries(head.split(',').map((c, i) => [c.trim(), i]));
    for (const row of rows){
      const c = row.split(',').map(x => x.trim());
      if (['lokalt', 'uppmatt', 'forslag'].includes(c[col.beslut]) && /^[a-z0-9]+(-[a-z0-9]+)*$/.test(c[col.region] || '') && c[col.region].length <= 29)
        chosenNames.set(c[col.scb_lan], c[col.region]), nameStatus.set(c[col.scb_lan], c[col.beslut]);
    }
  } catch {
    // Without the list every county gets its SCB code, which every county accepts.
  }
  renderConfig();
}

// The lists in the language shown: counties, releases, and when the list was made.
function fillCounties(){
  const sel = $('lan'), keep = sel.value;
  sel.innerHTML = '';
  sel.add(new Option(t('cfg.county.pick'), ''));
  for (const code of COUNTIES) sel.add(new Option(t('county.' + code), code));
  sel.value = keep;
}
function fillReleases(){
  const sel = $('release');
  sel.innerHTML = '';
  for (const r of offered(index.releases)) sel.add(new Option(r.tag, r.tag));
  if (release) sel.value = release.tag;
  $('gen').textContent = t('footer.gen', {time: index.generated.slice(0, 16).replace('T', ' ')});
}

applyStrings();
$('langs').addEventListener('click', e => {
  const a = e.target.closest('a[data-lang]');
  if (!a) return;
  e.preventDefault();
  setLang(a.dataset.lang);
});

for (const i of document.querySelectorAll('input[name="f"]')){
  i.addEventListener('change', () => {
    update();
  });
}
for (const i of document.querySelectorAll('input[name="install"]')) i.addEventListener('change', render);
$('lan').addEventListener('change', render);
$('pubkey').addEventListener('input', renderConfig);
const hex = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();

// An Ed25519 key made here and never sent anywhere: the public half fills the field, the
// private seed is shown once. mccontrol stores the same 32-byte seed as 64 hex characters.
$('genkey').addEventListener('click', async () => {
  let seed, pub;
  try {
    const pair = await crypto.subtle.generateKey({name: 'Ed25519'}, true, ['sign', 'verify']);
    pub = new Uint8Array(await crypto.subtle.exportKey('raw', pair.publicKey));
    seed = new Uint8Array(await crypto.subtle.exportKey('pkcs8', pair.privateKey)).slice(-32);
  } catch {
    $('pubkey-hint').textContent = t('cfg.key.nocrypto');
    return;
  }
  $('pubkey').value = hex(pub);
  $('seed').textContent = hex(seed);
  renderConfig();
  $('keydlg').showModal();
});
$('seed-copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('seed').textContent); $('seed-copy').textContent = t('copy.done'); }
  catch { $('seed-copy').textContent = t('copy.manual'); }
  setTimeout(() => { $('seed-copy').textContent = t('copy'); }, 1500);
});
$('seed-save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('seed').textContent + '\n'], {type: 'text/plain'}));
  a.download = 'key.seed';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('seed-done').addEventListener('click', () => { $('keydlg').close(); $('seed').textContent = ''; });
$('keydlg').addEventListener('cancel', e => e.preventDefault());

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('cmds').textContent); $('copy').textContent = t('copy.done'); }
  catch { $('copy').textContent = t('copy.manual'); }
  setTimeout(() => { $('copy').textContent = t('copy'); }, 1500);
});
$('filter').addEventListener('input', () => update());
$('boards').addEventListener('change', render);
$('release').addEventListener('change', () => { pickRelease($('release').value); update(); });
load();
</script>
</body>
</html>
